<!DOCTYPE html>
<html>
<head>
  <title>Quantum Market</title>
  <style>
    body {
      background-color: #0a0a0a;
      color: #00ffcc;
      font-family: Arial;
      text-align: center;
      padding: 50px;
    }

    h1 {
      font-size: 3em;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #00ffcc;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background: #00ccaa;
    }
  </style>
</head>
<body>

<h1>Quantum Market</h1>
<p>Welcome to the best market in the universe.</p>

<button onclick="randomItem()">Generate Item</button>

<p id="item"></p>

<script>
function randomItem() {
  const items = [
    "Neon Crystal",
    "Quantum Chip",
    "Dark Matter Orb",
    "Time Fragment",
    "Cosmic Key"
  ];

  const random = items[Math.floor(Math.random() * items.length)];
  document.getElementById("item").innerText = random;
}
</script>

</body>
</html>
