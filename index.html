<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cosmic Market</title>
<style>
/* ══════════════════════════════════════
   BASE / RESET
══════════════════════════════════════ */
*, *::before, *::after { box-sizing:border-box; }

body {
  margin:0; background:black; color:#e6ffff;
  font-family:'Segoe UI', system-ui, sans-serif;
  text-align:center;
  overflow-x:hidden;
  overflow-y:hidden;
}

canvas { position:fixed; top:0; left:0; z-index:0; pointer-events:none; }

/* ══════════════════════════════════════
   LAYOUT
══════════════════════════════════════ */
.main {
  position:relative; z-index:1;
  max-width:750px;
  margin:0 auto;
  padding:56px 12px 60px;
  height:100vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

h1 { font-size:clamp(22px, 5vw, 36px); margin:12px 0 8px; }
h2 { font-size:clamp(16px, 4vw, 24px); margin:16px 0 8px; }

/* ══════════════════════════════════════
   CARDS
══════════════════════════════════════ */
.card {
  background:rgba(255,255,255,0.07); backdrop-filter:blur(10px);
  border-radius:18px; padding:clamp(14px,4vw,25px); margin:12px 0;
  box-shadow:0 0 20px rgba(0,255,255,0.15); transition:0.3s;
}
.glow-mythical { box-shadow:0 0 25px yellow, 0 0 50px yellow !important; }
.glow-celestial { box-shadow:0 0 25px #bb66ff, 0 0 60px #bb66ff !important; }

/* ══════════════════════════════════════
   BUTTONS  — touch-friendly min 44px
══════════════════════════════════════ */
button {
  min-height:44px;
  padding:10px 18px; margin:5px;
  border-radius:12px; border:none;
  background:linear-gradient(45deg,#00ffd5,#00aaff);
  cursor:pointer; font-weight:bold;
  font-size:clamp(13px,3.5vw,15px);
  touch-action:manipulation;
  transition:transform 0.15s, opacity 0.15s;
}
button:active { transform:scale(0.96); }
button:disabled { opacity:0.4; cursor:not-allowed; transform:none !important; }

/* ══════════════════════════════════════
   SIDEBAR + OVERLAY
══════════════════════════════════════ */
#overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.55); z-index:39;
  backdrop-filter:blur(2px);
}
#overlay.show { display:block; }

.sidebar {
  position:fixed; top:0; left:0;
  width:min(80vw, 300px);
  height:100%; height:100dvh;
  background:#080818;
  border-right:1px solid rgba(0,255,255,0.12);
  transform:translateX(-100%);
  transition:transform 0.3s ease;
  padding:16px; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  z-index:40;
}
.sidebar.open { transform:translateX(0); }

/* Sidebar buttons — full width */
.sidebar button {
  width:100%; margin:4px 0;
  text-align:left; padding:12px 16px;
  border-radius:10px; font-size:15px;
}
.sidebar .close-btn {
  width:auto; text-align:center;
  margin-bottom:12px;
}

.open-menu-btn {
  position:fixed; top:10px; left:10px; z-index:50;
  width:44px; height:44px; padding:0;
  font-size:20px; border-radius:10px;
  text-align:center; line-height:44px;
}

.menu-page { display:none; }
.menu-page.active { display:block; }

/* ══════════════════════════════════════
   STATS BAR (top of main)
══════════════════════════════════════ */
#statsBar {
  display:flex; justify-content:center; gap:clamp(10px,3vw,24px);
  flex-wrap:wrap; margin:4px 0 8px;
  font-size:clamp(13px,3.5vw,16px);
}
#statsBar p { margin:2px 0; }

/* ══════════════════════════════════════
   RARITY COLOURS
══════════════════════════════════════ */
.Common    { color:white; }
.Uncommon  { color:#00ff99; }
.Rare      { color:#00ccff; }
.Legendary { color:gold; }
.Mythical  { color:yellow; }
.Celestial { color:#bb66ff; }

/* ══════════════════════════════════════
   PROGRESS BARS
══════════════════════════════════════ */
.bar-bg { background:#222; border-radius:10px; margin:6px 0; height:16px; }
.bar { height:16px; width:0%; background:#00ffd5; border-radius:10px; transition:width 0.4s; }
#achBar { background:#ffd700; }

/* ══════════════════════════════════════
   INVENTORY GRID
══════════════════════════════════════ */
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(min(130px, 42vw), 1fr));
  gap:10px;
}
.item {
  padding:10px 8px; border-radius:14px;
  background:rgba(255,255,255,0.06);
  font-size:clamp(11px,3vw,13px);
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
.item button { width:100%; padding:6px 0; font-size:12px; min-height:34px; }
.item-income { font-size:11px; opacity:0.75; }

/* ══════════════════════════════════════
   COLLECTION LIST
══════════════════════════════════════ */
#collectionList div {
  padding:5px 4px; font-size:13px;
  border-bottom:1px solid rgba(255,255,255,0.05);
  text-align:left;
}

/* ══════════════════════════════════════
   ACHIEVEMENTS
══════════════════════════════════════ */
.ach-card {
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,0.05); border-radius:12px;
  padding:10px 12px; margin:6px 0; text-align:left;
  border:1px solid transparent; transition:0.3s;
}
.ach-card.unlocked { border-color:gold; background:rgba(255,200,0,0.08); }
.ach-card.locked { opacity:0.35; }
.ach-icon { font-size:22px; flex-shrink:0; }
.ach-info { font-size:12px; line-height:1.5; min-width:0; }
.ach-info strong { font-size:13px; display:block; }

/* ══════════════════════════════════════
   STATS PAGE
══════════════════════════════════════ */
.stat-row {
  display:flex; justify-content:space-between; align-items:center;
  flex-wrap:wrap; gap:4px;
  background:rgba(255,255,255,0.05); border-radius:10px;
  padding:9px 12px; margin:5px 0; font-size:clamp(12px,3.2vw,14px);
  text-align:left;
}
.stat-row span { color:#00ffd5; font-weight:bold; white-space:nowrap; }

/* ══════════════════════════════════════
   SHOP
══════════════════════════════════════ */
.shop-desc { font-size:11px; opacity:0.6; margin:0 4px 8px; display:block; text-align:left; }

/* ══════════════════════════════════════
   EVENT BANNER
══════════════════════════════════════ */
#eventBanner {
  display:none; margin:0 0 10px; padding:12px 16px;
  border-radius:16px; border:2px solid #fff;
  background:rgba(255,255,255,0.07); backdrop-filter:blur(10px);
  animation:eventPulse 2s infinite;
}
#eventBanner.show { display:block; }
@keyframes eventPulse {
  0%,100% { box-shadow:0 0 10px var(--ec,#fff),0 0 20px var(--ec,#fff); }
  50%      { box-shadow:0 0 25px var(--ec,#fff),0 0 50px var(--ec,#fff); }
}
#eventTitle    { font-size:clamp(16px,4vw,20px); font-weight:bold; margin:0 0 4px; }
#eventDesc     { font-size:clamp(12px,3vw,14px); margin:0 0 10px; opacity:0.85; }
#eventTimerBg  { background:rgba(0,0,0,0.35); border-radius:10px; height:10px; }
#eventTimerBar { height:10px; border-radius:10px; transition:width 1s linear; }
#eventCountdown{ font-size:12px; margin-top:4px; opacity:0.7; }
#mysteryCrateArea { margin-top:10px; }
#mysteryCrateBtn  { background:linear-gradient(45deg,#ff66cc,#aa44ff); color:#fff; font-size:13px; }

/* ══════════════════════════════════════
   REBIRTH BANNER (main page)
══════════════════════════════════════ */
#rebirthBanner {
  display:none; margin:0 0 10px; padding:9px 14px;
  border-radius:14px; border:2px solid #ff6600;
  background:rgba(255,100,0,0.09);
  font-size:clamp(12px,3vw,14px); color:#ffcc00;
}
#rebirthBanner.show { display:block; }

/* ══════════════════════════════════════
   REBIRTH SIDEBAR BUTTON
══════════════════════════════════════ */
#rebirthBtn {
  background:linear-gradient(45deg,#ff6600,#ffcc00);
  color:#000; font-weight:bold;
  transition:box-shadow 0.4s, transform 0.15s;
}
#rebirthBtn.ready { animation:rebirthPulse 1.5s infinite; }
@keyframes rebirthPulse {
  0%,100% { box-shadow:0 0 10px #ff6600,0 0 20px #ffcc00; }
  50%      { box-shadow:0 0 22px #ff6600,0 0 44px #ffcc00; }
}

/* ══════════════════════════════════════
   TOASTS
══════════════════════════════════════ */
#saveToast {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:rgba(0,255,180,0.14); border:1px solid #00ffd5; color:#00ffd5;
  padding:10px 20px; border-radius:12px; font-weight:bold;
  opacity:0; transition:opacity 0.4s; pointer-events:none; z-index:300;
  max-width:90vw; white-space:normal; text-align:center;
}
#saveToast.show { opacity:1; }

#achToast {
  position:fixed; bottom:68px; left:50%; transform:translateX(-50%);
  background:rgba(255,200,0,0.13); border:2px solid gold; color:gold;
  padding:12px 20px; border-radius:16px; font-weight:bold;
  font-size:clamp(13px,3.5vw,15px);
  opacity:0; transition:opacity 0.5s; pointer-events:none; z-index:300;
  max-width:92vw; white-space:normal; text-align:center;
}
#achToast.show { opacity:1; }

/* ══════════════════════════════════════
   DROP TEXT
══════════════════════════════════════ */
#dropText {
  position:fixed; top:38%; width:100%;
  font-size:clamp(28px,8vw,48px); font-weight:bold;
  opacity:0; transition:opacity 0.3s;
  pointer-events:none; z-index:20;
  text-shadow:0 0 20px currentColor;
}
.showText { opacity:1 !important; }

/* ══════════════════════════════════════
   ITEM PREVIEW CARD ICON
══════════════════════════════════════ */
#icon { font-size:clamp(40px,12vw,60px); }

/* ══════════════════════════════════════
   DESKTOP REFINEMENTS
══════════════════════════════════════ */
@media (min-width:600px) {
  .main { padding:70px 20px 60px; }
  .card { margin:16px 0; padding:22px; }
  #statsBar { font-size:16px; gap:24px; }
  .sidebar button { font-size:15px; }
  .item button { font-size:13px; }
}
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div id="dropText"></div>
<div id="overlay" onclick="closeSidebar()"></div>
<div id="saveToast"></div>
<div id="achToast"></div>

<button class="open-menu-btn" onclick="openSidebar()">&#9776;</button>

<!-- ═══════ SIDEBAR ═══════ -->
<div id="sidebar" class="sidebar">
  <button class="close-btn" onclick="closeSidebar()">&#10006; Close</button>

  <!-- Main Menu -->
  <div id="mainMenu" class="menu-page active">
    <button onclick="openMenu('shopMenu')">&#128722; Shop</button>
    <button onclick="openMenu('collectionMenu')">&#128218; Collection</button>
    <button onclick="openMenu('achievementsMenu')">&#127942; Achievements</button>
    <button onclick="openMenu('statsMenu')">&#128202; Stats</button>
    <button onclick="openMenu('settingsMenu')">&#9881;&#65039; Settings</button>
    <hr style="border-color:#1a2a2a;margin:10px 0;">
    <button id="rebirthBtn" onclick="doRebirth()" disabled>&#9851; Rebirth</button>
    <div id="rebirthSidebarInfo" style="font-size:11px;opacity:0.6;padding:4px 4px 8px;text-align:left;line-height:1.6;"></div>
    <hr style="border-color:#1a2a2a;margin:10px 0;">
    <button onclick="saveGame()">&#128190; Save Game</button>
    <button onclick="loadGame()">&#128194; Load Game</button>
  </div>

  <!-- Shop -->
  <div id="shopMenu" class="menu-page">
    <button onclick="openMenu('mainMenu')">&larr; Back</button>
    <br>
    <button onclick="buyIncome()">&#128184; Income Boost<br><small>$<span id="incomeCost"></span></small></button>
    <span class="shop-desc">+10% to all item earnings</span>
    <button onclick="buyLuck()">&#127808; Luck Upgrade<br><small>$<span id="luckCost"></span></small></button>
    <span class="shop-desc">Increases chance of rarer drops</span>
  </div>

  <!-- Collection -->
  <div id="collectionMenu" class="menu-page">
    <button onclick="openMenu('mainMenu')">&larr; Back</button>
    <div class="bar-bg"><div id="collectionBar" class="bar"></div></div>
    <p id="collectionText" style="font-size:13px;margin:6px 0;"></p>
    <div id="collectionList"></div>
  </div>

  <!-- Achievements -->
  <div id="achievementsMenu" class="menu-page">
    <button onclick="openMenu('mainMenu')">&larr; Back</button>
    <h3 style="margin:10px 0 6px;">&#127942; Achievements</h3>
    <div class="bar-bg"><div id="achBar" class="bar"></div></div>
    <p id="achText" style="font-size:13px;margin:6px 0;"></p>
    <div id="achList"></div>
  </div>

  <!-- Stats -->
  <div id="statsMenu" class="menu-page">
    <button onclick="openMenu('mainMenu')">&larr; Back</button>
    <h3 style="margin:10px 0 6px;">&#128202; Lifetime Stats</h3>
    <div id="statsList"></div>
  </div>

  <!-- Settings -->
  <div id="settingsMenu" class="menu-page">
    <button onclick="openMenu('mainMenu')">&larr; Back</button>
    <br>
    <button onclick="resetGame()" style="background:linear-gradient(45deg,#cc2200,#ff4422);color:#fff;">
      &#129529; Reset All Progress
    </button>
  </div>
</div>

<!-- ═══════ MAIN PAGE ═══════ -->
<div class="main">
  <h1>&#127775; Cosmic Market</h1>

  <div id="rebirthBanner">&#9851; <span id="rebirthBannerText"></span></div>

  <div id="statsBar">
    <p>&#128176; $<span id="balance"></span></p>
    <p>&#9889; $<span id="incomeDisplay"></span>/sec</p>
    <p>&#127808; Luck: <span id="luck"></span></p>
  </div>
  <p id="multiplierDisplay" style="font-size:12px;opacity:0.65;margin:0 0 8px;"></p>

  <!-- Event Banner -->
  <div id="eventBanner">
    <div id="eventTitle"></div>
    <div id="eventDesc"></div>
    <div id="eventTimerBg"><div id="eventTimerBar" style="width:100%"></div></div>
    <div id="eventCountdown"></div>
    <div id="mysteryCrateArea" style="display:none;">
      <p id="mysteryCrateInfo" style="font-size:13px;margin:6px 0;"></p>
      <button id="mysteryCrateBtn" onclick="buyMysteryCrate()">Buy Mystery Item</button>
    </div>
  </div>

  <!-- Item Card -->
  <div class="card" id="itemCard">
    <div id="icon">&#10067;</div>
    <h2 id="name" style="margin:8px 0 4px;">Unknown</h2>
    <p id="rarity" style="margin:4px 0;">---</p>
    <p style="margin:4px 0;">$<span id="price">0</span></p>
    <p id="itemIncomePreview" style="font-size:13px;opacity:0.7;margin:4px 0;"></p>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;">
      <button id="genBtn" onclick="generate()" style="flex:1;min-width:100px;">&#127922; Generate</button>
      <button onclick="buy()" style="flex:1;min-width:100px;">&#128722; Buy</button>
    </div>
  </div>

  <h2>Inventory</h2>
  <div id="inventoryGrid" class="grid"></div>
</div>

<script>
/* ══════════════════════════════════════
   UI HELPERS
══════════════════════════════════════ */
function openSidebar(){
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("overlay").classList.add("show");
}
function closeSidebar(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}
function openMenu(m){
  document.querySelectorAll(".menu-page").forEach(x=>x.classList.remove("active"));
  document.getElementById(m).classList.add("active");
  if(m==="statsMenu") renderStats();
}
function showToast(msg){
  let t=document.getElementById("saveToast");
  t.innerText=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2400);
}
function showAchToast(name,icon){
  let t=document.getElementById("achToast");
  t.innerText="🏆 "+icon+" "+name+" — Unlocked!";
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),3200);
}
function formatTime(s){
  let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(h>0) return h+"h "+m+"m "+sec+"s";
  if(m>0) return m+"m "+sec+"s";
  return sec+"s";
}
function formatNum(n){
  if(n>=1e9) return (n/1e9).toFixed(2)+"B";
  if(n>=1e6) return (n/1e6).toFixed(2)+"M";
  if(n>=1e3) return (n/1e3).toFixed(1)+"K";
  return Math.floor(n).toString();
}
const rarityRank={Common:0,Uncommon:1,Rare:2,Legendary:3,Mythical:4,Celestial:5};

/* ══════════════════════════════════════
   GAME STATE
══════════════════════════════════════ */
let balance=1000, luck=0;
let incomeCost=200, luckCost=300;
let incomeMultiplier=1.0, incomeUpgradeCount=0;
let inventory=[], discovered=[];
let rebirthCount=0, rebirthRequirement=500000;

let stats={
  totalSpent:0, totalSoldCount:0, totalGenerated:0, totalBought:0,
  boughtCelestial:false, incomeUpgrades:0, luckUpgrades:0,
  lifetimeEarned:0, eventsSurvived:0, playtime:0,
  bestRarity:"Common", totalRebirths:0
};

/* ══════════════════════════════════════
   INCOME SYSTEM
══════════════════════════════════════ */
const rarityIncome={Common:2,Uncommon:6,Rare:15,Legendary:80,Mythical:200,Celestial:500};
function getRebirthBonus(){ return 1+rebirthCount*0.25; }
function getItemIncome(item){
  return Math.floor((rarityIncome[item.rarity]||0)*incomeMultiplier*getRebirthBonus());
}
function calcTotalIncome(){
  let surge=(activeEvent?.id==="power_surge")?2:1;
  return inventory.reduce((s,i)=>s+getItemIncome(i),0)*surge;
}

/* ══════════════════════════════════════
   ITEMS
══════════════════════════════════════ */
const items=[
  {name:"Neon Crystal",    icon:"💎",  rarity:"Common",   price:250},
  {name:"Quantum Chip",    icon:"💾",  rarity:"Common",   price:250},
  {name:"Dark Matter Orb", icon:"⚫",  rarity:"Common",   price:250},
  {name:"Circuit Fragment",icon:"🔌",  rarity:"Common",   price:250},
  {name:"Energy Cell",     icon:"🔋",  rarity:"Common",   price:250},
  {name:"Time Fragment",   icon:"⌛",  rarity:"Uncommon", price:500},
  {name:"Cosmic Key",      icon:"🗝️", rarity:"Uncommon", price:500},
  {name:"Signal Beacon",   icon:"📡",  rarity:"Uncommon", price:500},
  {name:"Star Dust",       icon:"✨",  rarity:"Uncommon", price:500},
  {name:"Plasma Core",     icon:"🔮",  rarity:"Rare",     price:1000},
  {name:"Stellar Map",     icon:"🗺️", rarity:"Rare",     price:1000},
  {name:"Astro Compass",   icon:"🧭",  rarity:"Rare",     price:1000},
  {name:"Satellite Core",  icon:"🛰️", rarity:"Rare",     price:1000},
  {name:"Void Engine",     icon:"⚙️", rarity:"Legendary",price:5000},
  {name:"Gravity Shard",   icon:"🧊",  rarity:"Legendary",price:5000},
  {name:"Time Stabilizer", icon:"⏱️", rarity:"Legendary",price:5000},
  {name:"Stellar Crown",   icon:"👑",  rarity:"Legendary",price:5000},
  {name:"Solar Relic",     icon:"📿",  rarity:"Mythical", price:10000},
  {name:"AI Core",         icon:"🤖",  rarity:"Mythical", price:10000},
  {name:"Eternal Reactor", icon:"♾️",  rarity:"Mythical", price:10000},
  {name:"Singularity Core",icon:"🌀",  rarity:"Mythical", price:10000},
  {name:"Wormhole Lens",   icon:"🔍",  rarity:"Celestial",price:20000},
  {name:"Universe Seed",   icon:"🌱",  rarity:"Celestial",price:20000},
  {name:"God Particle",    icon:"⚛️", rarity:"Celestial",price:20000}
];

/* ══════════════════════════════════════
   REBIRTH
══════════════════════════════════════ */
function getRebirthRequirement(){
  return Math.floor(rebirthRequirement*Math.pow(1.8,rebirthCount));
}
function updateRebirthUI(){
  let req=getRebirthRequirement(), ready=balance>=req;
  let btn=document.getElementById("rebirthBtn");
  btn.disabled=!ready;
  btn.classList.toggle("ready",ready);
  let bonus=getRebirthBonus(), nextBonus=1+(rebirthCount+1)*0.25;
  let info=document.getElementById("rebirthSidebarInfo");
  if(rebirthCount>0){
    info.innerHTML="&#9851; Rebirths: <b style='color:#ffcc00'>"+rebirthCount+"</b>"
      +"<br>Bonus: <b style='color:#ffcc00'>x"+bonus.toFixed(2)+"</b>"
      +"<br>Next: x"+nextBonus.toFixed(2)+" @ $"+formatNum(req);
  } else {
    info.innerHTML="Rebirth requires $"+formatNum(req)
      +"<br>Reward: <b style='color:#ffcc00'>+25% item income forever</b>";
  }
  let banner=document.getElementById("rebirthBanner");
  if(rebirthCount>0){
    banner.classList.add("show");
    document.getElementById("rebirthBannerText").innerText=
      "Rebirth x"+rebirthCount+" — x"+bonus.toFixed(2)+" income bonus active!";
  } else { banner.classList.remove("show"); }
}
function doRebirth(){
  let req=getRebirthRequirement();
  if(balance<req){showToast("⚠️ Not enough balance!");return;}
  if(!confirm("⚠️ REBIRTH?\n\nResets balance, inventory & upgrades.\nKeeps collection, achievements & stats.\n\nReward: +25% permanent income bonus!\nBonus after rebirth: x"+((1+(rebirthCount+1)*0.25).toFixed(2))))return;
  rebirthCount++; stats.totalRebirths++;
  balance=1000; luck=0; incomeCost=200; luckCost=300;
  incomeMultiplier=1.0; incomeUpgradeCount=0; inventory=[];
  activeEvent=null; eventTimeLeft=0; nextEventIn=90;
  hideEventBanner(); currentItem=null;
  document.getElementById("icon").innerText="❓";
  document.getElementById("name").innerText="Unknown";
  document.getElementById("rarity").innerText="---";
  document.getElementById("price").innerText="0";
  document.getElementById("itemIncomePreview").innerText="";
  updateUI(); showToast("🔁 Rebirth "+rebirthCount+"! x"+getRebirthBonus().toFixed(2)+" bonus!");
}

/* ══════════════════════════════════════
   LIMITED TIME EVENTS
══════════════════════════════════════ */
const eventTypes=[
  {id:"cosmic_storm",  icon:"🌩️",name:"Cosmic Storm",  desc:"Luck boosted by +15!", color:"#44ddff", duration:60,
   onStart:()=>{luck+=15;updateUI();}, onEnd:()=>{luck=Math.max(0,luck-15);updateUI();}},
  {id:"market_crash",  icon:"💸",name:"Market Crash",  desc:"All items 50% off!",   color:"#ff4444", duration:60},
  {id:"rare_surge",    icon:"⭐",name:"Rare Surge",    desc:"Guaranteed Rare+ drops!", color:"#00ccff",duration:60},
  {id:"power_surge",   icon:"⚡",name:"Power Surge",   desc:"Item income doubled!",  color:"#ffdd00", duration:60},
  {id:"mystery_crate", icon:"🎁",name:"Mystery Crate", desc:"Exclusive item available!", color:"#cc66ff",duration:60}
];
const mysteryItems=[
  {name:"Void Crystal",      icon:"🔷",rarity:"Legendary",price:3000},
  {name:"Nebula Fragment",   icon:"🌫️",rarity:"Mythical", price:7000},
  {name:"Event Horizon Gem", icon:"🕳️",rarity:"Celestial",price:15000},
  {name:"Stardust Relic",    icon:"💫",rarity:"Mythical", price:8000},
  {name:"Cosmic Anomaly",    icon:"🌀",rarity:"Celestial",price:18000},
];
let activeEvent=null,eventTimeLeft=0,eventDuration=0,nextEventIn=90;
let mysteryCrateItem=null,mysteryCrateBought=false;

function triggerEvent(){
  let type=eventTypes[Math.floor(Math.random()*eventTypes.length)];
  activeEvent=type; eventDuration=type.duration; eventTimeLeft=type.duration;
  if(type.id==="mystery_crate"){mysteryCrateItem=mysteryItems[Math.floor(Math.random()*mysteryItems.length)];mysteryCrateBought=false;}
  if(type.onStart) type.onStart();
  showEventBanner();
  showToast(type.icon+" "+type.name+" started!");
}
function endEvent(){
  if(activeEvent?.onEnd) activeEvent.onEnd();
  stats.eventsSurvived++;
  activeEvent=null; eventTimeLeft=0; mysteryCrateItem=null; mysteryCrateBought=false;
  hideEventBanner();
  nextEventIn=120+Math.floor(Math.random()*60);
}
function showEventBanner(){
  let b=document.getElementById("eventBanner");
  b.classList.add("show");
  b.style.setProperty("--ec",activeEvent.color);
  b.style.borderColor=activeEvent.color;
  document.getElementById("eventTitle").innerText=activeEvent.icon+" "+activeEvent.name;
  document.getElementById("eventTitle").style.color=activeEvent.color;
  document.getElementById("eventDesc").innerText=activeEvent.desc;
  document.getElementById("eventTimerBar").style.background=activeEvent.color;
  if(activeEvent.id==="mystery_crate"&&mysteryCrateItem){
    document.getElementById("mysteryCrateArea").style.display="block";
    document.getElementById("mysteryCrateInfo").innerHTML=
      mysteryCrateItem.icon+" <b>"+mysteryCrateItem.name+"</b> ("+mysteryCrateItem.rarity
      +") — $"+mysteryCrateItem.price+" | ⚡ $"+getItemIncome(mysteryCrateItem)+"/sec";
    let btn=document.getElementById("mysteryCrateBtn");
    btn.disabled=false; btn.innerText="Buy $"+mysteryCrateItem.price;
  } else { document.getElementById("mysteryCrateArea").style.display="none"; }
}
function hideEventBanner(){
  document.getElementById("eventBanner").classList.remove("show");
  document.getElementById("mysteryCrateArea").style.display="none";
}
function updateEventBanner(){
  if(!activeEvent) return;
  document.getElementById("eventTimerBar").style.width=(eventTimeLeft/eventDuration*100)+"%";
  document.getElementById("eventCountdown").innerText="⏱️ "+eventTimeLeft+"s remaining";
}
function buyMysteryCrate(){
  if(!mysteryCrateItem||mysteryCrateBought) return;
  if(balance<mysteryCrateItem.price){showToast("⚠️ Not enough money!");return;}
  balance-=mysteryCrateItem.price;
  stats.totalSpent+=mysteryCrateItem.price; stats.totalBought++;
  if(mysteryCrateItem.rarity==="Celestial") stats.boughtCelestial=true;
  trackBestRarity(mysteryCrateItem.rarity);
  inventory.push(mysteryCrateItem);
  if(!discovered.includes(mysteryCrateItem.name)) discovered.push(mysteryCrateItem.name);
  mysteryCrateBought=true;
  document.getElementById("mysteryCrateBtn").disabled=true;
  document.getElementById("mysteryCrateBtn").innerText="✅ Purchased!";
  updateUI(); checkAchievements();
  showToast("🎁 "+mysteryCrateItem.name+" added!");
}

/* ══════════════════════════════════════
   ACHIEVEMENTS
══════════════════════════════════════ */
const achievements=[

  {id:"high_roller",       icon:"🎰",name:"High Roller",          desc:"Spend $50,000 total",            check:()=>stats.totalSpent>=50000},
  {id:"lucky_find",        icon:"🔵",name:"Lucky Find",           desc:"Get your first Rare drop",       check:()=>rarityRank[stats.bestRarity]>=2},
  {id:"legendary_pull",    icon:"🟡",name:"Legendary Pull",       desc:"Get your first Legendary",       check:()=>rarityRank[stats.bestRarity]>=3},
  {id:"touched_by_stars",  icon:"🔥",name:"Touched by the Stars", desc:"Get your first Mythical",        check:()=>rarityRank[stats.bestRarity]>=4},

  {id:"hoarder",           icon:"📦",name:"Hoarder",              desc:"Hold 20 items at once",          check:()=>inventory.length>=20},

  {id:"big_spender",       icon:"👑",name:"Big Spender",          desc:"Buy a Celestial item",           check:()=>stats.boughtCelestial},
  {id:"power_surge_ach",   icon:"⚡",name:"Power Surge",          desc:"Buy your first Income Boost",    check:()=>stats.incomeUpgrades>=1},
  {id:"lucky_charm",       icon:"🍀",name:"Lucky Charm",          desc:"Buy your first Luck upgrade",    check:()=>stats.luckUpgrades>=1},
  {id:"maximized",         icon:"📈",name:"Maximized",            desc:"Reach $500/sec from items",      check:()=>calcTotalIncome()>=500},
  {id:"fortune_favors",    icon:"🎯",name:"Fortune Favors",       desc:"Reach Luck level 10",            check:()=>luck>=10},
  {id:"getting_started",   icon:"🚀",name:"Getting Started",      desc:"Generate 10 items",              check:()=>stats.totalGenerated>=10},
  {id:"obsessed",          icon:"🔄",name:"Obsessed",             desc:"Generate 100 items",             check:()=>stats.totalGenerated>=100},
  {id:"dedicated_trader",  icon:"🏅",name:"Dedicated Trader",     desc:"Generate 500 items",             check:()=>stats.totalGenerated>=500},
  {id:"born_again",        icon:"🔁",name:"Born Again",           desc:"Perform your first Rebirth",     check:()=>rebirthCount>=1},
  {id:"veteran",           icon:"🌟",name:"Veteran",              desc:"Perform 5 Rebirths",             check:()=>rebirthCount>=5},
  {id:"event_hunter",      icon:"🌩️",name:"Event Hunter",        desc:"Survive 10 events",              check:()=>stats.eventsSurvived>=10},
  {id:"millionaire",       icon:"💎",name:"Lifetime Millionaire", desc:"Earn $1M lifetime",              check:()=>stats.lifetimeEarned>=1000000},
];
let unlockedAchs=new Set();
function checkAchievements(){
  achievements.forEach(a=>{
    if(!unlockedAchs.has(a.id)&&a.check()){unlockedAchs.add(a.id);showAchToast(a.name,a.icon);}
  });
  renderAchievements();
}
function renderAchievements(){
  let list=document.getElementById("achList");
  if(!list) return;
  list.innerHTML="";
  achievements.forEach(a=>{
    let unlocked=unlockedAchs.has(a.id);
    let d=document.createElement("div");
    d.className="ach-card "+(unlocked?"unlocked":"locked");
    d.innerHTML='<div class="ach-icon">'+a.icon+'</div>'
      +'<div class="ach-info"><strong>'+a.name+(unlocked?" ✅":"")+'</strong>'+a.desc+'</div>';
    list.appendChild(d);
  });
  let count=unlockedAchs.size,total=achievements.length;
  document.getElementById("achBar").style.width=(count/total*100)+"%";
  document.getElementById("achText").innerText=count+" / "+total+" unlocked";
}

/* ══════════════════════════════════════
   SAVE / LOAD / RESET
══════════════════════════════════════ */
function saveGame(){
  localStorage.setItem("cosmicMarketSave",JSON.stringify({
    balance,luck,incomeCost,luckCost,incomeMultiplier,incomeUpgradeCount,
    inventory,discovered,stats,unlockedAchs:[...unlockedAchs],
    rebirthCount,rebirthRequirement
  }));
  showToast("✅ Game Saved!");
}
function loadGame(){
  let raw=localStorage.getItem("cosmicMarketSave");
  if(!raw){showToast("⚠️ No save found!");return;}
  let d=JSON.parse(raw);
  balance=d.balance??1000; luck=d.luck??0;
  incomeCost=d.incomeCost??200; luckCost=d.luckCost??300;
  incomeMultiplier=d.incomeMultiplier??1.0; incomeUpgradeCount=d.incomeUpgradeCount??0;
  inventory=d.inventory??[]; discovered=d.discovered??[];
  rebirthCount=d.rebirthCount??0; rebirthRequirement=d.rebirthRequirement??500000;
  stats=Object.assign({totalSpent:0,totalSoldCount:0,totalGenerated:0,totalBought:0,
    boughtCelestial:false,incomeUpgrades:0,luckUpgrades:0,lifetimeEarned:0,
    eventsSurvived:0,playtime:0,bestRarity:"Common",totalRebirths:0},d.stats||{});
  unlockedAchs=new Set(d.unlockedAchs??[]);
  updateUI(); showToast("📂 Game Loaded!");
}
function resetGame(){
  if(!confirm("Reset ALL progress? This cannot be undone!")) return;
  localStorage.removeItem("cosmicMarketSave");
  balance=1000;luck=0;incomeCost=200;luckCost=300;
  incomeMultiplier=1.0;incomeUpgradeCount=0;rebirthCount=0;rebirthRequirement=500000;
  inventory=[];discovered=[];
  stats={totalSpent:0,totalSoldCount:0,totalGenerated:0,totalBought:0,
    boughtCelestial:false,incomeUpgrades:0,luckUpgrades:0,lifetimeEarned:0,
    eventsSurvived:0,playtime:0,bestRarity:"Common",totalRebirths:0};
  unlockedAchs=new Set();
  activeEvent=null;eventTimeLeft=0;nextEventIn=90;
  hideEventBanner();currentItem=null;
  document.getElementById("icon").innerText="❓";
  document.getElementById("name").innerText="Unknown";
  document.getElementById("rarity").innerText="---";
  document.getElementById("price").innerText="0";
  document.getElementById("itemIncomePreview").innerText="";
  updateUI();showToast("🧹 Game Reset!");
}

/* ══════════════════════════════════════
   CORE GAME LOGIC
══════════════════════════════════════ */
function trackBestRarity(r){
  if(rarityRank[r]>rarityRank[stats.bestRarity]) stats.bestRarity=r;
}
function getRarity(){
  if(activeEvent?.id==="rare_surge"){
    let r=Math.random()*100-Math.min(luck,30);
    if(r<2) return "Celestial"; if(r<8) return "Mythical"; if(r<20) return "Legendary";
    return "Rare";
  }
  let r=Math.random()*100-Math.min(luck,30);
  if(r<1) return "Celestial"; if(r<5) return "Mythical"; if(r<12) return "Legendary";
  if(r<25) return "Rare"; if(r<50) return "Uncommon";
  return "Common";
}

let currentItem, canGen=true;

function generate(){
  if(!canGen) return;
  canGen=false;
  document.getElementById("genBtn").disabled=true;
  setTimeout(()=>{canGen=true;document.getElementById("genBtn").disabled=false;},1000);
  let rarity=getRarity();
  let pool=items.filter(i=>i.rarity===rarity);
  currentItem=pool.length?pool[Math.floor(Math.random()*pool.length)]:items[Math.floor(Math.random()*items.length)];
  trackBestRarity(currentItem.rarity);
  let displayPrice=activeEvent?.id==="market_crash"?Math.floor(currentItem.price*0.5):currentItem.price;
  document.getElementById("icon").innerText=currentItem.icon;
  document.getElementById("name").innerText=currentItem.name;
  document.getElementById("rarity").innerText=currentItem.rarity+(activeEvent?.id==="market_crash"?" 💸50% OFF":"");
  document.getElementById("rarity").className=currentItem.rarity;
  document.getElementById("price").innerText=displayPrice;
  document.getElementById("itemIncomePreview").innerText="⚡ +$"+getItemIncome(currentItem)+"/sec if purchased";
  stats.totalGenerated++;
  rareEffect(currentItem.rarity);
  checkAchievements();
}
function rareEffect(r){
  if(r==="Mythical"||r==="Celestial"){
    let t=document.getElementById("dropText"),card=document.getElementById("itemCard");
    t.innerText=r==="Celestial"?"🌌 CELESTIAL!!!":"🔥 MYTHICAL!";
    t.style.color=r==="Celestial"?"#bb66ff":"yellow";
    t.classList.add("showText");
    card.classList.add(r==="Celestial"?"glow-celestial":"glow-mythical");
    setTimeout(()=>{t.classList.remove("showText");card.classList.remove("glow-mythical","glow-celestial");},1200);
  }
}
function buy(){
  if(!currentItem) return;
  let price=activeEvent?.id==="market_crash"?Math.floor(currentItem.price*0.5):currentItem.price;
  if(balance>=price){
    balance-=price; stats.totalSpent+=price; stats.totalBought++;
    if(currentItem.rarity==="Celestial") stats.boughtCelestial=true;
    inventory.push(currentItem);
    if(!discovered.includes(currentItem.name)) discovered.push(currentItem.name);
    updateUI(); checkAchievements();
  }
}
function sellItem(index){
  let item=inventory[index]; if(!item) return;
  balance+=Math.floor(item.price*0.5);
  stats.totalSoldCount++;
  inventory.splice(index,1);
  updateUI(); checkAchievements();
}
function buyIncome(){
  if(balance>=incomeCost){
    balance-=incomeCost; stats.totalSpent+=incomeCost;
    incomeMultiplier=Math.round((incomeMultiplier+0.10)*100)/100;
    incomeUpgradeCount++; stats.incomeUpgrades++;
    incomeCost=Math.floor(incomeCost*1.5);
    updateUI(); checkAchievements();
  }
}
function buyLuck(){
  if(balance>=luckCost){
    balance-=luckCost; stats.totalSpent+=luckCost;
    luck++; stats.luckUpgrades++;
    luckCost=Math.floor(luckCost*1.6);
    updateUI(); checkAchievements();
  }
}

/* ══════════════════════════════════════
   MAIN TICK
══════════════════════════════════════ */
setInterval(()=>{
  let earned=calcTotalIncome();
  balance+=earned; stats.lifetimeEarned+=earned; stats.playtime++;
  if(activeEvent){eventTimeLeft--;if(eventTimeLeft<=0)endEvent();else updateEventBanner();}
  else{nextEventIn--;if(nextEventIn<=0)triggerEvent();}
  updateUI(); checkAchievements();
},1000);

/* ══════════════════════════════════════
   UPDATE UI
══════════════════════════════════════ */
function updateUI(){
  document.getElementById("balance").innerText=formatNum(balance);
  document.getElementById("incomeDisplay").innerText=formatNum(calcTotalIncome());
  document.getElementById("luck").innerText=luck;
  document.getElementById("incomeCost").innerText=formatNum(incomeCost);
  document.getElementById("luckCost").innerText=formatNum(luckCost);

  let parts=[];
  if(incomeUpgradeCount>0) parts.push("x"+incomeMultiplier.toFixed(1)+" boost");
  if(rebirthCount>0) parts.push("x"+getRebirthBonus().toFixed(2)+" rebirth");
  document.getElementById("multiplierDisplay").innerText=parts.length?"("+parts.join("  •  ")+")":"";

  // Inventory
  let grid=document.getElementById("inventoryGrid");
  grid.innerHTML="";
  inventory.forEach((i,idx)=>{
    let d=document.createElement("div");
    d.className="item "+i.rarity;
    d.innerHTML=i.icon+"<br><b>"+i.name+"</b>"
      +'<div class="item-income">⚡ $'+getItemIncome(i)+'/sec</div>'
      +"<button onclick='sellItem("+idx+")'>Sell</button>";
    grid.appendChild(d);
  });

  // Collection
  let list=document.getElementById("collectionList");
  list.innerHTML="";
  items.forEach(i=>{
    let d=document.createElement("div");
    d.innerText=i.icon+" "+i.name+" ("+i.rarity+")";
    d.style.opacity=discovered.includes(i.name)?1:0.3;
    list.appendChild(d);
  });
  let pct=(discovered.length/items.length)*100;
  document.getElementById("collectionBar").style.width=pct+"%";
  document.getElementById("collectionText").innerText=discovered.length+" / "+items.length+" discovered";

  renderAchievements();
  updateRebirthUI();
}

/* ══════════════════════════════════════
   STAR BACKGROUND
══════════════════════════════════════ */
const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);
let stars=[];
for(let i=0;i<130;i++) stars.push({
  x:Math.random()*canvas.width, y:Math.random()*canvas.height,
  size:Math.random()*1.8+0.4, speed:Math.random()*0.45+0.1,
  alpha:Math.random()*0.5+0.5
});
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{
    ctx.globalAlpha=s.alpha*(0.7+0.3*Math.random());
    ctx.fillStyle="#00ffd5";
    ctx.fillRect(s.x,s.y,s.size,s.size);
    s.y+=s.speed;
    if(s.y>canvas.height){s.y=0;s.x=Math.random()*canvas.width;}
  });
  ctx.globalAlpha=1;
  requestAnimationFrame(animate);
}
animate();

loadGame();
updateUI();
</script>
