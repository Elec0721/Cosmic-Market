<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cosmic Market</title>
<style>
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:black;color:#e6ffff;font-family:'Segoe UI',system-ui,sans-serif;text-align:center;overflow-x:hidden;overflow-y:hidden;}
canvas{position:fixed;top:0;left:0;z-index:0;pointer-events:none;}

.main{position:relative;z-index:1;max-width:750px;margin:0 auto;padding:56px 12px 60px;height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;}
.main::-webkit-scrollbar{display:none;}

h1{font-size:clamp(22px,5vw,36px);margin:12px 0 8px;}
h2{font-size:clamp(16px,4vw,24px);margin:16px 0 8px;}

.card{background:rgba(255,255,255,0.07);backdrop-filter:blur(10px);border-radius:18px;padding:clamp(14px,4vw,25px);margin:12px 0;box-shadow:0 0 20px rgba(0,255,255,0.15);transition:box-shadow 0.3s;}
.glow-mythical{box-shadow:0 0 25px yellow,0 0 50px yellow!important;}
.glow-celestial{box-shadow:0 0 25px #bb66ff,0 0 60px #bb66ff!important;}
.glow-universal{animation:universalCardPulse 1s infinite!important;}
@keyframes universalCardPulse{0%,100%{box-shadow:0 0 30px #fff,0 0 60px #aaffff,0 0 90px #8888ff;}50%{box-shadow:0 0 50px #fff,0 0 90px #ffaaff,0 0 120px #ff88ff;}}

button{min-height:44px;padding:10px 18px;margin:5px;border-radius:12px;border:none;background:linear-gradient(45deg,#00ffd5,#00aaff);cursor:pointer;font-weight:bold;font-size:clamp(13px,3.5vw,15px);touch-action:manipulation;transition:transform 0.15s,opacity 0.15s;}
button:active{transform:scale(0.96);}
button:disabled{opacity:0.4;cursor:not-allowed;transform:none!important;}

/* Sidebar */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:39;backdrop-filter:blur(2px);}
#overlay.show{display:block;}
.sidebar{position:fixed;top:0;left:0;width:min(80vw,300px);height:100%;height:100dvh;background:#080818;border-right:1px solid rgba(0,255,255,0.12);transform:translateX(-100%);transition:transform 0.3s ease;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:40;scrollbar-width:none;}
.sidebar::-webkit-scrollbar{display:none;}
.sidebar.open{transform:translateX(0);}
.sidebar button{width:100%;margin:4px 0;text-align:left;padding:12px 16px;border-radius:10px;font-size:15px;}
.sidebar .close-btn{width:auto;text-align:center;margin-bottom:12px;}
.open-menu-btn{position:fixed;top:10px;left:10px;z-index:50;width:44px;height:44px;padding:0;font-size:20px;border-radius:10px;text-align:center;line-height:44px;}
.menu-page{display:none;}
.menu-page.active{display:block;}

/* Rarity colours */
.Common{color:white;}
.Uncommon{color:#00ff99;}
.Rare{color:#00ccff;}
.Legendary{color:gold;}
.Mythical{color:yellow;}
.Celestial{color:#bb66ff;}
.Universal{color:#fff;text-shadow:0 0 6px #fff,0 0 14px #aaf,0 0 28px #88f;animation:uShimmer 2s infinite;}
@keyframes uShimmer{0%,100%{text-shadow:0 0 6px #fff,0 0 14px #aaffff,0 0 28px #8888ff;}33%{text-shadow:0 0 8px #fff,0 0 18px #ffaaff,0 0 32px #ff88ff;}66%{text-shadow:0 0 8px #fff,0 0 18px #ffffaa,0 0 32px #ffff88;}}

/* Bars */
.bar-bg{background:#222;border-radius:10px;margin:6px 0;height:16px;}
.bar{height:16px;width:0%;background:#00ffd5;border-radius:10px;transition:width 0.4s;}
#achBar{background:#ffd700;}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(130px,42vw),1fr));gap:10px;}
.item{padding:10px 8px;border-radius:14px;background:rgba(255,255,255,0.06);font-size:clamp(11px,3vw,13px);display:flex;flex-direction:column;align-items:center;gap:4px;}
.item button{width:100%;padding:6px 0;font-size:12px;min-height:34px;}
.item-income{font-size:11px;opacity:0.75;}

/* Stats bar */
#statsBar{display:flex;justify-content:center;gap:clamp(10px,3vw,24px);flex-wrap:wrap;margin:4px 0 8px;font-size:clamp(13px,3.5vw,16px);}
#statsBar p{margin:2px 0;}

/* Collection */
#collectionList div{padding:5px 4px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.05);text-align:left;}

/* Achievements */
.ach-card{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.05);border-radius:12px;padding:10px 12px;margin:6px 0;text-align:left;border:1px solid transparent;transition:0.3s;}
.ach-card.unlocked{border-color:gold;background:rgba(255,200,0,0.08);}
.ach-card.locked{opacity:0.35;}
.ach-icon{font-size:22px;flex-shrink:0;}
.ach-info{font-size:12px;line-height:1.5;min-width:0;}
.ach-info strong{font-size:13px;display:block;}

/* Stats page */
.stat-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;background:rgba(255,255,255,0.05);border-radius:10px;padding:9px 12px;margin:5px 0;font-size:clamp(12px,3.2vw,14px);text-align:left;}
.stat-row span{color:#00ffd5;font-weight:bold;white-space:nowrap;}

/* Shop */
.shop-desc{font-size:11px;opacity:0.6;margin:0 4px 8px;display:block;text-align:left;}

/* Event banner */
#eventBanner{display:none;margin:0 0 10px;padding:12px 16px;border-radius:16px;border:2px solid #fff;background:rgba(255,255,255,0.07);backdrop-filter:blur(10px);animation:eventPulse 2s infinite;}
#eventBanner.show{display:block;}
@keyframes eventPulse{0%,100%{box-shadow:0 0 10px var(--ec,#fff),0 0 20px var(--ec,#fff);}50%{box-shadow:0 0 25px var(--ec,#fff),0 0 50px var(--ec,#fff);}}
#eventTitle{font-size:clamp(16px,4vw,20px);font-weight:bold;margin:0 0 4px;}
#eventDesc{font-size:clamp(12px,3vw,14px);margin:0 0 10px;opacity:0.85;}
#eventTimerBg{background:rgba(0,0,0,0.35);border-radius:10px;height:10px;}
#eventTimerBar{height:10px;border-radius:10px;transition:width 1s linear;}
#eventCountdown{font-size:12px;margin-top:4px;opacity:0.7;}
#mysteryCrateArea{margin-top:10px;}
#mysteryCrateBtn{background:linear-gradient(45deg,#ff66cc,#aa44ff);color:#fff;font-size:13px;}

/* Rebirth */
#rebirthBanner{display:none;margin:0 0 10px;padding:9px 14px;border-radius:14px;border:2px solid #ff6600;background:rgba(255,100,0,0.09);font-size:clamp(12px,3vw,14px);color:#ffcc00;}
#rebirthBanner.show{display:block;}
#rebirthBtn{background:linear-gradient(45deg,#ff6600,#ffcc00);color:#000;font-weight:bold;transition:box-shadow 0.4s,transform 0.15s;}
#rebirthBtn.ready{animation:rebirthPulse 1.5s infinite;}
@keyframes rebirthPulse{0%,100%{box-shadow:0 0 10px #ff6600,0 0 20px #ffcc00;}50%{box-shadow:0 0 22px #ff6600,0 0 44px #ffcc00;}}

/* Daily challenges */
.challenge-card{background:rgba(255,255,255,0.05);border-radius:14px;padding:12px;margin:8px 0;text-align:left;border:1px solid rgba(255,255,255,0.1);transition:0.3s;}
.challenge-card.done{border-color:#00ffd5;background:rgba(0,255,180,0.07);}
.challenge-card.claimed{border-color:#555;opacity:0.5;}
.ch-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.ch-icon{font-size:20px;}
.ch-desc{font-size:13px;font-weight:bold;flex:1;}
.ch-reward{font-size:12px;color:#00ffd5;white-space:nowrap;}
.ch-bar-bg{background:#222;border-radius:6px;height:10px;margin:4px 0;}
.ch-bar{height:10px;border-radius:6px;background:linear-gradient(90deg,#00ffd5,#00aaff);transition:width 0.4s;}
.ch-progress{font-size:11px;opacity:0.7;margin:3px 0 6px;}
.ch-claim-btn{background:linear-gradient(45deg,#00ffd5,#00aaff);border:none;border-radius:8px;padding:6px 14px;font-weight:bold;font-size:13px;cursor:pointer;color:#000;min-height:34px;}
.ch-claim-btn:disabled{opacity:0.4;cursor:not-allowed;}
#dailyReset{font-size:12px;opacity:0.6;margin:4px 0 10px;}

/* Toasts */
#saveToast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,255,180,0.14);border:1px solid #00ffd5;color:#00ffd5;padding:10px 20px;border-radius:12px;font-weight:bold;opacity:0;transition:opacity 0.4s;pointer-events:none;z-index:300;max-width:90vw;white-space:normal;text-align:center;}
#saveToast.show{opacity:1;}
#achToast{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);background:rgba(255,200,0,0.13);border:2px solid gold;color:gold;padding:12px 20px;border-radius:16px;font-weight:bold;font-size:clamp(13px,3.5vw,15px);opacity:0;transition:opacity 0.5s;pointer-events:none;z-index:300;max-width:92vw;white-space:normal;text-align:center;}
#achToast.show{opacity:1;}

/* Drop text */
#dropText{position:fixed;top:38%;width:100%;font-size:clamp(28px,8vw,48px);font-weight:bold;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:20;text-shadow:0 0 20px currentColor;}
.showText{opacity:1!important;}

/* Audio controls in settings */
.audio-toggle{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.05);border-radius:10px;padding:10px 14px;margin:6px 0;font-size:14px;}
.toggle-btn{min-height:34px;padding:5px 14px;font-size:13px;margin:0;border-radius:8px;width:auto;}
.toggle-btn.off{background:linear-gradient(45deg,#444,#666);}

#icon{font-size:clamp(40px,12vw,60px);}

@media(min-width:600px){
  .main{padding:70px 20px 60px;}
  .card{margin:16px 0;padding:22px;}
  #statsBar{font-size:16px;gap:24px;}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="dropText"></div>
<div id="overlay" onclick="closeSidebar()"></div>
<div id="saveToast"></div>
<div id="achToast"></div>
<button class="open-menu-btn" onclick="openSidebar()">&#9776;</button>

<!-- ═══ SIDEBAR ═══ -->
<div id="sidebar" class="sidebar">
  <button class="close-btn" onclick="closeSidebar()">&#10006; Close</button>

  <div id="mainMenu" class="menu-page active">
    <button onclick="openMenu('shopMenu')">&#128722; Shop</button>
    <button onclick="openMenu('collectionMenu')">&#128218; Collection</button>
    <button onclick="openMenu('achievementsMenu')">&#127942; Achievements</button>
    <button onclick="openMenu('dailyMenu')">&#128197; Daily Challenges</button>
    <button onclick="openMenu('statsMenu')">&#128202; Stats</button>
    <button onclick="openMenu('settingsMenu')">&#9881;&#65039; Settings</button>
    <hr style="border-color:#1a2a2a;margin:10px 0;">
    <button id="rebirthBtn" onclick="doRebirth()" disabled>&#9851; Rebirth</button>
    <div id="rebirthSidebarInfo" style="font-size:11px;opacity:0.6;padding:4px 4px 8px;text-align:left;line-height:1.6;"></div>
    <hr style="border-color:#1a2a2a;margin:10px 0;">
    <button onclick="saveGame()">&#128190; Save Game</button>
    <button onclick="loadGame()">&#128194; Load Game</button>
  </div>

  <div id="shopMenu" class="menu-page">
    <button onclick="openMenu('mainMenu')">&larr; Back</button><br>
    <button onclick="buyIncome()">&#128184; Income Boost<br><small>$<span id="incomeCost"></span></small></button>
    <span class="shop-desc">+10% to all item earnings</span>
    <button onclick="buyLuck()">&#127808; Luck Upgrade<br><small>$<span id="luckCost"></span></small></button>
    <span class="shop-desc">Increases chance of rarer drops</span>
  </div>

  <div id="collectionMenu" class="menu-page">
    <button onclick="openMenu('mainMenu')">&larr; Back</button>
    <div class="bar-bg"><div id="collectionBar" class="bar"></div></div>
    <p id="collectionText" style="font-size:13px;margin:6px 0;"></p>
    <div id="collectionList"></div>
  </div>

  <div id="achievementsMenu" class="menu-page">
    <button onclick="openMenu('mainMenu')">&larr; Back</button>
    <h3 style="margin:10px 0 6px;">&#127942; Achievements</h3>
    <div class="bar-bg"><div id="achBar" class="bar"></div></div>
    <p id="achText" style="font-size:13px;margin:6px 0;"></p>
    <div id="achList"></div>
  </div>

  <div id="dailyMenu" class="menu-page">
    <button onclick="openMenu('mainMenu')">&larr; Back</button>
    <h3 style="margin:10px 0 4px;">&#128197; Daily Challenges</h3>
    <div id="dailyReset"></div>
    <div id="dailyList"></div>
  </div>

  <div id="statsMenu" class="menu-page">
    <button onclick="openMenu('mainMenu')">&larr; Back</button>
    <h3 style="margin:10px 0 6px;">&#128202; Lifetime Stats</h3>
    <div id="statsList"></div>
  </div>

  <div id="settingsMenu" class="menu-page">
    <button onclick="openMenu('mainMenu')">&larr; Back</button>
    <h3 style="margin:10px 0 8px;">&#9881;&#65039; Settings</h3>
    <div class="audio-toggle">
      <span>&#127925; Music</span>
      <button class="toggle-btn" id="musicToggleBtn" onclick="toggleMusic()">ON</button>
    </div>
    <div class="audio-toggle">
      <span>&#128266; Sound FX</span>
      <button class="toggle-btn" id="sfxToggleBtn" onclick="toggleSFX()">ON</button>
    </div>
    <br>
    <button onclick="resetGame()" style="background:linear-gradient(45deg,#cc2200,#ff4422);color:#fff;">&#129529; Reset All Progress</button>
  </div>
</div>

<!-- ═══ MAIN PAGE ═══ -->
<div class="main">
  <h1>&#127775; Cosmic Market</h1>
  <div id="rebirthBanner">&#9851; <span id="rebirthBannerText"></span></div>
  <div id="statsBar">
    <p>&#128176; $<span id="balance"></span></p>
    <p>&#9889; $<span id="incomeDisplay"></span>/sec</p>
    <p>&#127808; Luck: <span id="luck"></span></p>
  </div>
  <p id="multiplierDisplay" style="font-size:12px;opacity:0.65;margin:0 0 8px;"></p>

  <div id="eventBanner">
    <div id="eventTitle"></div>
    <div id="eventDesc"></div>
    <div id="eventTimerBg"><div id="eventTimerBar" style="width:100%"></div></div>
    <div id="eventCountdown"></div>
    <div id="mysteryCrateArea" style="display:none;">
      <p id="mysteryCrateInfo" style="font-size:13px;margin:6px 0;"></p>
      <button id="mysteryCrateBtn" onclick="buyMysteryCrate()">Buy Mystery Item</button>
    </div>
  </div>

  <div class="card" id="itemCard">
    <div id="icon">&#10067;</div>
    <h2 id="name" style="margin:8px 0 4px;">Unknown</h2>
    <p id="rarity" style="margin:4px 0;">---</p>
    <p style="margin:4px 0;">$<span id="price">0</span></p>
    <p id="itemIncomePreview" style="font-size:13px;opacity:0.7;margin:4px 0;"></p>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;">
      <button id="genBtn" onclick="generate()" style="flex:1;min-width:100px;">&#127922; Generate</button>
      <button onclick="buy()" style="flex:1;min-width:100px;">&#128722; Buy</button>
    </div>
  </div>

  <h2>Inventory</h2>
  <div id="inventoryGrid" class="grid"></div>
</div>

<script>
/* ══════════════════════════════════════
   AUDIO SYSTEM
══════════════════════════════════════ */
let audioCtx = null;
let musicEnabled = true;
let sfxEnabled   = true;
let musicPlaying = false;
let musicNodes   = [];
let musicInterval = null;

function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(freq, type, dur, vol, delay=0){
  if(!sfxEnabled) return;
  try{
    let c=getCtx(), o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(freq, c.currentTime+delay);
    g.gain.setValueAtTime(vol, c.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+delay+dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime+delay); o.stop(c.currentTime+delay+dur);
  }catch(e){}
}

function snd(name){
  if(!sfxEnabled) return;
  switch(name){
    case 'click':    playTone(900,'sine',0.05,0.08); break;
    case 'generate': {
      let c=getCtx(),o=c.createOscillator(),g=c.createGain();
      o.type='sawtooth';
      o.frequency.setValueAtTime(150,c.currentTime);
      o.frequency.exponentialRampToValueAtTime(550,c.currentTime+0.25);
      g.gain.setValueAtTime(0.07,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.28);
      o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.28);
      break;
    }
    case 'buy':      [440,554,659].forEach((f,i)=>playTone(f,'sine',0.25,0.18,i*0.07)); break;
    case 'sell':     [660,494,392].forEach((f,i)=>playTone(f,'sine',0.18,0.15,i*0.07)); break;
    case 'upgrade':  [523,659,784,1047].forEach((f,i)=>playTone(f,'sine',0.2,0.15,i*0.06)); break;
    case 'rare':     [523,659,784].forEach((f,i)=>playTone(f,'sine',0.35,0.2,i*0.09)); break;
    case 'legendary':[392,494,587,698,880].forEach((f,i)=>playTone(f,'triangle',0.5,0.25,i*0.08)); break;
    case 'mythical': [262,330,392,523,659,784].forEach((f,i)=>playTone(f,'sine',0.7,0.28,i*0.07)); break;
    case 'celestial':[131,262,523,659,1047,1319].forEach((f,i)=>playTone(f,'sine',1.0,0.3,i*0.06)); break;
    case 'universal':[65,131,196,262,330,392,523,659,784,1047].forEach((f,i)=>playTone(f,'sine',2.5,0.28,i*0.05)); break;
    case 'achievement':[523,659,784,1047,1319].forEach((f,i)=>playTone(f,'sine',0.45,0.22,i*0.09)); break;
    case 'event':    [440,550,440,660,550].forEach((f,i)=>playTone(f,'square',0.12,0.12,i*0.09)); break;
    case 'rebirth':  [130,164,196,247,330,392,523,659,784,1047].forEach((f,i)=>playTone(f,'sine',1.2,0.22,i*0.09)); break;
    case 'challenge':[523,784,1047,1319].forEach((f,i)=>playTone(f,'sine',0.5,0.25,i*0.08)); break;
  }
}

// Drop sound by rarity
function sndDrop(r){
  const map={Common:null,Uncommon:null,Rare:'rare',Legendary:'legendary',Mythical:'mythical',Celestial:'celestial',Universal:'universal'};
  if(map[r]) snd(map[r]);
}

// Ambient space music
const MUSIC_NOTES=[65.41,82.41,98,130.81,164.81,196,261.63,329.63];
function startMusic(){
  if(!musicEnabled||musicPlaying) return;
  musicPlaying=true;
  try{
    let c=getCtx();
    let master=c.createGain(); master.gain.setValueAtTime(0.04,c.currentTime); master.connect(c.destination);
    // Drone
    [65.41,130.81].forEach(f=>{
      let o=c.createOscillator(),g=c.createGain();
      o.type='sine'; o.frequency.setValueAtTime(f,c.currentTime);
      g.gain.setValueAtTime(0.5,c.currentTime);
      o.connect(g); g.connect(master); o.start();
      musicNodes.push(o);
    });
    // Random melodic notes every 2.5s
    musicInterval=setInterval(()=>{
      if(!musicEnabled||!musicPlaying) return;
      try{
        let c2=getCtx();
        let note=MUSIC_NOTES[Math.floor(Math.random()*MUSIC_NOTES.length)]*2;
        let o=c2.createOscillator(),g=c2.createGain();
        o.type='sine'; o.frequency.setValueAtTime(note,c2.currentTime);
        g.gain.setValueAtTime(0.03,c2.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,c2.currentTime+3.5);
        o.connect(g); g.connect(c2.destination); o.start(); o.stop(c2.currentTime+3.5);
      }catch(e){}
    },2500);
  }catch(e){}
}
function stopMusic(){
  musicPlaying=false;
  musicNodes.forEach(n=>{try{n.stop();}catch(e){}});
  musicNodes=[];
  if(musicInterval){clearInterval(musicInterval);musicInterval=null;}
}
function toggleMusic(){
  musicEnabled=!musicEnabled;
  document.getElementById('musicToggleBtn').textContent=musicEnabled?'ON':'OFF';
  document.getElementById('musicToggleBtn').classList.toggle('off',!musicEnabled);
  if(musicEnabled) startMusic(); else stopMusic();
  saveSoundPrefs();
}
function toggleSFX(){
  sfxEnabled=!sfxEnabled;
  document.getElementById('sfxToggleBtn').textContent=sfxEnabled?'ON':'OFF';
  document.getElementById('sfxToggleBtn').classList.toggle('off',!sfxEnabled);
  saveSoundPrefs();
}
function saveSoundPrefs(){
  localStorage.setItem('cmSoundPrefs',JSON.stringify({musicEnabled,sfxEnabled}));
}
function loadSoundPrefs(){
  let raw=localStorage.getItem('cmSoundPrefs');
  if(!raw) return;
  let p=JSON.parse(raw);
  musicEnabled=p.musicEnabled??true;
  sfxEnabled=p.sfxEnabled??true;
  document.getElementById('musicToggleBtn').textContent=musicEnabled?'ON':'OFF';
  document.getElementById('musicToggleBtn').classList.toggle('off',!musicEnabled);
  document.getElementById('sfxToggleBtn').textContent=sfxEnabled?'ON':'OFF';
  document.getElementById('sfxToggleBtn').classList.toggle('off',!sfxEnabled);
}

/* ══════════════════════════════════════
   DAILY CHALLENGES
══════════════════════════════════════ */
const challengePool=[
  {id:'gen15',    icon:'🎲',desc:'Generate 15 items',          reward:1500,  key:'generated', target:15},
  {id:'gen40',    icon:'🎲',desc:'Generate 40 items',          reward:4000,  key:'generated', target:40},

function todayStr(){ return new Date().toDateString(); }

function seededRand(seed){
  let x=Math.sin(seed)*10000; return x-Math.floor(x);
}

function pickDailyChallenges(){
  let seed=todayStr().split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  let pool=[...challengePool], chosen=[];
  for(let i=0;i<3&&pool.length>0;i++){
    let s=(seed*(i+1)*1664525+1013904223)>>>0;
    let idx=s%pool.length;
    chosen.push(pool[idx]);
    pool.splice(idx,1);
  }
  return chosen;
}

function initDailyChallenges(){
  let today=todayStr();
  if(dailyDate!==today){
    dailyDate=today;
    dailyChallenges=pickDailyChallenges();
    dailyClaimed=[];
    dailyP={generated:0,bought:0,sold:0,events:0,spent:0,crashBuy:0,upgrades:0,bestRarity:'Common'};
  }
}

function getChallengeProgress(ch){
  switch(ch.key){
    case 'generated': return Math.min(dailyP.generated, ch.target);
    case 'bought':    return Math.min(dailyP.bought, ch.target);
    case 'sold':      return Math.min(dailyP.sold, ch.target);
    case 'events':    return Math.min(dailyP.events, ch.target);
    case 'spent':     return Math.min(dailyP.spent, ch.target);
    case 'crashBuy':  return Math.min(dailyP.crashBuy, ch.target);
    case 'upgrades':  return Math.min(dailyP.upgrades, ch.target);
    case 'inventory': return Math.min(inventory.length, ch.target);
    case 'rarityGte': return rarityRank[dailyP.bestRarity]>=rarityRank[ch.target]?1:0;
    default: return 0;
  }
}

function getChallengeDone(ch){
  let target = ch.key==='rarityGte' ? 1 : ch.target;
  return getChallengeProgress(ch) >= target;
}

function claimChallenge(id){
  let ch=dailyChallenges.find(c=>c.id===id);
  if(!ch||dailyClaimed.includes(id)||!getChallengeDone(ch)) return;
  dailyClaimed.push(id);
  balance+=ch.reward;
  snd('challenge');
  showToast('🎯 Challenge complete! +$'+formatNum(ch.reward));
  updateUI();
  renderDailyChallenges();
}

function renderDailyChallenges(){
  let list=document.getElementById('dailyList');
  if(!list) return;

  // Time until midnight
  let now=new Date(), midnight=new Date(now); midnight.setHours(24,0,0,0);
  let diff=Math.floor((midnight-now)/1000);
  let h=Math.floor(diff/3600),m=Math.floor((diff%3600)/60),s=diff%60;
  document.getElementById('dailyReset').innerText=
    '🔄 Resets in '+h+'h '+m+'m '+s+'s';

  list.innerHTML='';
  dailyChallenges.forEach(ch=>{
    let claimed=dailyClaimed.includes(ch.id);
    let done=getChallengeDone(ch);
    let prog=getChallengeProgress(ch);
    let target=ch.key==='rarityGte'?1:ch.target;
    let pct=Math.min(100,(prog/target)*100);

    let d=document.createElement('div');
    d.className='challenge-card'+(claimed?' claimed':done?' done':'');
    d.innerHTML=`
      <div class="ch-header">
        <span class="ch-icon">${ch.icon}</span>
        <span class="ch-desc">${ch.desc}</span>
        <span class="ch-reward">💰 $${formatNum(ch.reward)}</span>
      </div>
      <div class="ch-bar-bg"><div class="ch-bar" style="width:${pct}%"></div></div>
      <div class="ch-progress">${claimed?'✅ Claimed':ch.key==='rarityGte'?(done?'✅ Done':'Not yet'):prog+' / '+target}</div>
      ${(!claimed&&done)?`<button class="ch-claim-btn" onclick="claimChallenge('${ch.id}')">Claim $${formatNum(ch.reward)}</button>`:''}
    `;
    list.appendChild(d);
  });
}

  let list=document.getElementById('achList');if(!list)return;list.innerHTML='';
  achievements.forEach(a=>{let u=unlockedAchs.has(a.id);let d=document.createElement('div');d.className='ach-card '+(u?'unlocked':'locked');d.innerHTML='<div class="ach-icon">'+a.icon+'</div><div class="ach-info"><strong>'+a.name+(u?' ✅':'')+'</strong>'+a.desc+'</div>';list.appendChild(d);});
  let c=unlockedAchs.size,t=achievements.length;
  document.getElementById('achBar').style.width=(c/t*100)+'%';
  document.getElementById('achText').innerText=c+' / '+t+' unlocked';
}

function checkDailyChallenges(){
  // Update daily best rarity
  if(rarityRank[stats.bestRarity]>rarityRank[dailyP.bestRarity]) dailyP.bestRarity=stats.bestRarity;
}

/* ══════════════════════════════════════
   SAVE / LOAD / RESET
══════════════════════════════════════ */
function saveGame(){
  localStorage.setItem('cosmicMarketSave',JSON.stringify({balance,luck,incomeCost,luckCost,incomeMultiplier,incomeUpgradeCount,inventory,discovered,stats,unlockedAchs:[...unlockedAchs],rebirthCount,rebirthRequirement,dailyDate,dailyChallenges,dailyClaimed,dailyP}));
  showToast('✅ Game Saved!');
}
function loadGame(){
  let raw=localStorage.getItem('cosmicMarketSave');
  if(!raw){showToast('⚠️ No save found!');initDailyChallenges();return;}
  let d=JSON.parse(raw);
  balance=d.balance??1000;luck=d.luck??0;incomeCost=d.incomeCost??200;luckCost=d.luckCost??300;
  incomeMultiplier=d.incomeMultiplier??1.0;incomeUpgradeCount=d.incomeUpgradeCount??0;
  inventory=d.inventory??[];discovered=d.discovered??[];
  rebirthCount=d.rebirthCount??0;rebirthRequirement=d.rebirthRequirement??500000;
  stats=Object.assign({totalSpent:0,totalSoldCount:0,totalGenerated:0,totalBought:0,boughtCelestial:false,incomeUpgrades:0,luckUpgrades:0,lifetimeEarned:0,eventsSurvived:0,playtime:0,bestRarity:'Common',totalRebirths:0},d.stats||{});
  unlockedAchs=new Set(d.unlockedAchs??[]);
  // Load daily data
  dailyDate=d.dailyDate??'';
  dailyChallenges=d.dailyChallenges??[];
  dailyClaimed=d.dailyClaimed??[];
  dailyP=Object.assign({generated:0,bought:0,sold:0,events:0,spent:0,crashBuy:0,upgrades:0,bestRarity:'Common'},d.dailyP||{});
  initDailyChallenges(); // resets if new day
  updateUI();showToast('📂 Game Loaded!');
}
function resetGame(){
  if(!confirm('Reset ALL progress? This cannot be undone!'))return;
  localStorage.removeItem('cosmicMarketSave');
  balance=1000;luck=0;incomeCost=200;luckCost=300;incomeMultiplier=1.0;incomeUpgradeCount=0;
  rebirthCount=0;rebirthRequirement=500000;inventory=[];discovered=[];
  stats={totalSpent:0,totalSoldCount:0,totalGenerated:0,totalBought:0,boughtCelestial:false,incomeUpgrades:0,luckUpgrades:0,lifetimeEarned:0,eventsSurvived:0,playtime:0,bestRarity:'Common',totalRebirths:0};
  unlockedAchs=new Set();activeEvent=null;eventTimeLeft=0;nextEventIn=90;
  hideEventBanner();currentItem=null;
  dailyDate='';initDailyChallenges();
  document.getElementById('icon').innerText='❓';document.getElementById('name').innerText='Unknown';document.getElementById('rarity').innerText='---';document.getElementById('price').innerText='0';document.getElementById('itemIncomePreview').innerText='';
  updateUI();showToast('🧹 Game Reset!');
}

/* ══════════════════════════════════════
   CORE GAME LOGIC
══════════════════════════════════════ */
function trackBestRarity(r){if(rarityRank[r]>rarityRank[stats.bestRarity])stats.bestRarity=r;if(rarityRank[r]>rarityRank[dailyP.bestRarity])dailyP.bestRarity=r;}
function getRarity(){
  if(activeEvent?.id==='rare_surge'){let r=Math.random()*100-Math.min(luck,30);if(r<0.1)return 'Universal';if(r<2)return 'Celestial';if(r<8)return 'Mythical';if(r<20)return 'Legendary';return 'Rare';}
  let r=Math.random()*100-Math.min(luck,30);
  if(r<0.1)return 'Universal';if(r<1)return 'Celestial';if(r<5)return 'Mythical';if(r<12)return 'Legendary';if(r<25)return 'Rare';if(r<50)return 'Uncommon';return 'Common';
}

let currentItem,canGen=true;

function generate(auto=false){
  if(!canGen)return;
  canGen=false;document.getElementById('genBtn').disabled=true;
  setTimeout(()=>{canGen=true;document.getElementById('genBtn').disabled=false;},1000);
  if(!auto)snd('generate');
  let rarity=getRarity();
  let pool=items.filter(i=>i.rarity===rarity);
  currentItem=pool.length?pool[Math.floor(Math.random()*pool.length)]:items[Math.floor(Math.random()*items.length)];
  trackBestRarity(currentItem.rarity);
  let displayPrice=activeEvent?.id==='market_crash'?Math.floor(currentItem.price*0.5):currentItem.price;
  document.getElementById('icon').innerText=currentItem.icon;
  document.getElementById('name').innerText=currentItem.name;
  document.getElementById('rarity').innerText=currentItem.rarity+(activeEvent?.id==='market_crash'?' 💸50% OFF':'');
  document.getElementById('rarity').className=currentItem.rarity;
  document.getElementById('price').innerText=displayPrice;
  document.getElementById('itemIncomePreview').innerText='⚡ +$'+getItemIncome(currentItem)+'/sec if purchased';
  stats.totalGenerated++;dailyP.generated++;
  sndDrop(currentItem.rarity);
  rareEffect(currentItem.rarity);
  checkAchievements();checkDailyChallenges();
}

function rareEffect(r){
  if(r==='Mythical'||r==='Celestial'||r==='Universal'){
    let t=document.getElementById('dropText'),card=document.getElementById('itemCard');
    if(r==='Universal'){t.innerText='✨ UNIVERSAL ✨';t.style.color='#ffffff';card.classList.add('glow-universal');}
    else if(r==='Celestial'){t.innerText='🌌 CELESTIAL!!!';t.style.color='#bb66ff';card.classList.add('glow-celestial');}
    else{t.innerText='🔥 MYTHICAL!';t.style.color='yellow';card.classList.add('glow-mythical');}
    t.classList.add('showText');
    setTimeout(()=>{t.classList.remove('showText');card.classList.remove('glow-mythical','glow-celestial','glow-universal');},r==='Universal'?2500:1200);
  }
}

function buy(){
  if(!currentItem)return;
  let price=activeEvent?.id==='market_crash'?Math.floor(currentItem.price*0.5):currentItem.price;
  if(balance>=price){
    balance-=price;stats.totalSpent+=price;stats.totalBought++;dailyP.bought++;dailyP.spent+=price;
    if(activeEvent?.id==='market_crash')dailyP.crashBuy++;
    if(currentItem.rarity==='Celestial')stats.boughtCelestial=true;
    inventory.push(currentItem);
    if(!discovered.includes(currentItem.name))discovered.push(currentItem.name);
    snd('buy');updateUI();checkAchievements();checkDailyChallenges();
    setTimeout(()=>generate(true),300);
  }
}

function sellItem(index){
  let item=inventory[index];if(!item)return;
  balance+=Math.floor(item.price*0.5);stats.totalSoldCount++;dailyP.sold++;
  inventory.splice(index,1);snd('sell');updateUI();checkAchievements();checkDailyChallenges();
}

function buyIncome(){
  if(balance>=incomeCost){
    balance-=incomeCost;stats.totalSpent+=incomeCost;dailyP.spent+=incomeCost;dailyP.upgrades++;
    incomeMultiplier=Math.round((incomeMultiplier+0.10)*100)/100;incomeUpgradeCount++;stats.incomeUpgrades++;
    incomeCost=Math.floor(incomeCost*1.5);
    snd('upgrade');updateUI();checkAchievements();checkDailyChallenges();
  }
}

function buyLuck(){
  if(balance>=luckCost){
    balance-=luckCost;stats.totalSpent+=luckCost;dailyP.spent+=luckCost;dailyP.upgrades++;
    luck++;stats.luckUpgrades++;luckCost=Math.floor(luckCost*1.6);
    snd('upgrade');updateUI();checkAchievements();checkDailyChallenges();
  }
}

/* ══════════════════════════════════════
   MAIN TICK
══════════════════════════════════════ */
setInterval(()=>{
  let earned=calcTotalIncome();balance+=earned;stats.lifetimeEarned+=earned;stats.playtime++;
  if(activeEvent){eventTimeLeft--;if(eventTimeLeft<=0)endEvent();else updateEventBanner();}
  else{nextEventIn--;if(nextEventIn<=0)triggerEvent();}
  updateUI();checkAchievements();checkDailyChallenges();
},1000);

// Update daily challenge timer every second if menu is open
setInterval(()=>{if(document.getElementById('dailyMenu').classList.contains('active'))renderDailyChallenges();},1000);

/* ══════════════════════════════════════
   UPDATE UI
══════════════════════════════════════ */
function updateUI(){
  document.getElementById('balance').innerText=formatNum(balance);
  document.getElementById('incomeDisplay').innerText=formatNum(calcTotalIncome());
  document.getElementById('luck').innerText=luck;
  document.getElementById('incomeCost').innerText=formatNum(incomeCost);
  document.getElementById('luckCost').innerText=formatNum(luckCost);
  let parts=[];
  if(incomeUpgradeCount>0)parts.push('x'+incomeMultiplier.toFixed(1)+' boost');
  if(rebirthCount>0)parts.push('x'+getRebirthBonus().toFixed(2)+' rebirth');
  document.getElementById('multiplierDisplay').innerText=parts.length?'('+parts.join('  •  ')+')'  :'';
  // Inventory
  let grid=document.getElementById('inventoryGrid');grid.innerHTML='';
  inventory.forEach((i,idx)=>{let d=document.createElement('div');d.className='item '+i.rarity;d.innerHTML=i.icon+'<br><b>'+i.name+'</b><div class="item-income">⚡ $'+getItemIncome(i)+'/sec</div><button onclick="sellItem('+idx+')">Sell</button>';grid.appendChild(d);});
  // Collection
  let list=document.getElementById('collectionList');list.innerHTML='';
  items.forEach(i=>{let d=document.createElement('div');d.innerText=i.icon+' '+i.name+' ('+i.rarity+')';d.style.opacity=discovered.includes(i.name)?1:0.3;list.appendChild(d);});
  let pct=(discovered.length/items.length)*100;
  document.getElementById('collectionBar').style.width=pct+'%';
  document.getElementById('collectionText').innerText=discovered.length+' / '+items.length+' discovered';
  renderAchievements();updateRebirthUI();
}

/* ══════════════════════════════════════
   STAR BACKGROUND
══════════════════════════════════════ */
const canvas=document.getElementById('stars'),ctx=canvas.getContext('2d');
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resizeCanvas();window.addEventListener('resize',resizeCanvas);
let stars=[];for(let i=0;i<130;i++)stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:Math.random()*1.8+0.4,speed:Math.random()*0.45+0.1,alpha:Math.random()*0.5+0.5});
function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);stars.forEach(s=>{ctx.globalAlpha=s.alpha*(0.7+0.3*Math.random());ctx.fillStyle='#00ffd5';ctx.fillRect(s.x,s.y,s.size,s.size);s.y+=s.speed;if(s.y>canvas.height){s.y=0;s.x=Math.random()*canvas.width;}});ctx.globalAlpha=1;requestAnimationFrame(animate);}
animate();

// Start music + load on first user interaction
let started=false;
document.addEventListener('click',()=>{if(!started){started=true;loadSoundPrefs();if(musicEnabled)startMusic();}},{once:true});

loadSoundPrefs();
loadGame();
updateUI();
</script>
</body>
</html>
